<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Centre d’Entraide de Jette – Numéro appelé</title><style>
*{box-sizing:border-box}body{margin:0;background:#0e493f;color:#fff;font-family:Arial,Helvetica,sans-serif;min-height:100dvh;display:grid;grid-template-rows:auto 1fr auto;padding:3.5vh 2.2vw;gap:2vh}header{display:flex;align-items:center;gap:1.2vw;padding-right:12vw}header img{width:8vw;min-width:65px;border-radius:14%;display:block}h1{font-size:clamp(16px,2vw,36px);margin:0 0 .4rem}header p{margin:0;font-size:clamp(13px,1.25vw,23px)}main{text-align:center;align-self:start;padding-top:3.5vh}h2{font-size:clamp(18px,2.4vw,44px);letter-spacing:.28em;margin:0 0 2vh}#number{font-size:min(26vw,45vh);font-weight:700;line-height:1.03;font-variant-numeric:tabular-nums;text-shadow:0 10px 22px #0004}footer{display:grid;grid-template-columns:1fr auto;align-items:end;gap:2vw}footer strong{text-align:center;font-size:clamp(20px,3.3vw,60px);letter-spacing:.06em;color:#ffeba0;padding-bottom:.2em}.qr{background:white;color:#0e493f;text-decoration:none;border-radius:12px;padding:10px;text-align:center;font-size:clamp(10px,.85vw,15px);font-weight:bold;width:10vw;min-width:105px}.qr img{width:100%;display:block}button{position:absolute;right:1vw;top:2vh;border:1px solid #ffffff35;background:#ffffff12;color:white;border-radius:30px;padding:.65em 1em;font:inherit;cursor:pointer}#status{position:absolute;top:8vh;right:2vw;font-size:13px;color:#ffeba0}.flash{animation:flash .45s}@keyframes flash{50%{color:#ffd54a}}@media(max-width:650px){body{padding:18px;gap:16px}header{padding-right:0;gap:12px;margin-top:45px}header img{width:64px}button{top:12px;right:12px}#status{top:48px;right:12px}main{align-self:center;padding:0}h2{letter-spacing:.18em}#number{font-size:min(29vw,40vh)}footer{grid-template-columns:1fr;justify-items:center;gap:18px}footer strong{font-size:clamp(20px,5vw,30px)}.qr{width:100px;min-width:0}}@media(prefers-reduced-motion:reduce){.flash{animation:none}}
#egg{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#0e493f;color:white;font-size:min(26vw,45vh);font-weight:900;overflow:hidden;pointer-events:none}#egg[hidden]{display:none}#egg b{z-index:1}#egg i{position:absolute;left:50%;top:50%;width:12px;height:18px;background:var(--c);animation:burst 1.6s ease-out both}@keyframes burst{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}#egg.active{animation:eggflash .35s ease-out}@keyframes eggflash{from{background:#fff}to{background:#0e493f}}@media(prefers-reduced-motion:reduce){#egg.active,#egg i{animation:none}#egg i{display:none}}</style></head><body><header><img src="assets/cej-logo.png" alt="Logo CEJ"><div><h1>Centre d'Entraide de Jette - ASBL</h1><p>rue Henri Werrie 11, 1090 Jette</p></div></header><button id="sound">🔔 Activer le son</button><span id="status" role="status">Connexion…</span><main><h2>NUMÉRO APPELÉ</h2><div id="number" aria-live="polite">–</div></main><footer><strong>VEUILLEZ VOUS PRÉSENTER</strong><a class="qr" href="https://inlimbo-tt.github.io/livecounter-mona"><img src="assets/counter-qr.png" alt="QR code du compteur">Scannez pour suivre</a></footer><div id="egg" hidden aria-hidden="true"><b>ACAB</b></div><script type="module">
import {db,counter,connected,onValue} from './firebase.js';
import {ref} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js';
const number=document.querySelector('#number'), sound=document.querySelector('#sound'), status=document.querySelector('#status');
let audio, previous=null;
function ding() {
    if (!audio || audio.state !== 'running') return;
    const start = audio.currentTime + 0.015;
    const notes = [466.16, 392.00, 293.66];
    const master = audio.createGain();
    master.gain.value = 0.8;
    master.connect(audio.destination);
    notes.forEach((frequency, i) => {
        const t = start + i * 0.25;
        const duration = i === 2 ? 1.5 : 0.32;
        for (const [ratio, volume] of [[1, 0.65], [2, 0.12], [3, 0.04]]) {
            const oscillator = audio.createOscillator();
            const envelope = audio.createGain();
            oscillator.type = 'sine';
            oscillator.frequency.value = frequency * ratio;
            envelope.gain.setValueAtTime(0.001, t);
            envelope.gain.exponentialRampToValueAtTime(volume, t + 0.012);
            envelope.gain.exponentialRampToValueAtTime(0.001, t + duration);
            oscillator.connect(envelope).connect(master);
            oscillator.start(t);
            oscillator.stop(t + duration + 0.02);
            if (i === 2 && ratio === 1) oscillator.onended = () => master.disconnect();
        }
    });
}
sound.onclick=async()=>{try{audio??=new (window.AudioContext||window.webkitAudioContext)();await audio.resume();ding();sound.textContent='🔔 Son activé';}catch(e){status.textContent=e.message;}};
onValue(connected,s=>status.textContent=s.val()?'':'Hors ligne · reconnexion…');
onValue(counter,s=>{const n=s.val();if(!Number.isInteger(n)||n<1||n>100)return;number.textContent=String(n).padStart(3,'0');if(previous!==null&&previous!==n){ding();number.classList.remove('flash');void number.offsetWidth;number.classList.add('flash');}previous=n;},e=>status.textContent=e.message);
const egg=document.querySelector('#egg');let eggTimer,initialEgg=true,lastEgg=null;
function celebrate(){clearTimeout(eggTimer);egg.querySelectorAll('i').forEach(e=>e.remove());egg.hidden=false;egg.classList.remove('active');void egg.offsetWidth;egg.classList.add('active');for(let j=0;j<100;j++){const e=document.createElement('i'),angle=Math.random()*Math.PI*2,d=100+Math.random()*Math.max(innerWidth,innerHeight)*.65;e.style.setProperty('--x',Math.cos(angle)*d+'px');e.style.setProperty('--y',Math.sin(angle)*d+'px');e.style.setProperty('--r',Math.random()*900+'deg');e.style.setProperty('--c',['#ffeba0','#ff5577','#45e6b0','#65aaff','#fff'][j%5]);egg.append(e);}eggTimer=setTimeout(()=>{egg.hidden=true;egg.querySelectorAll('i').forEach(e=>e.remove());},3000);}
onValue(ref(db,'easterEgg'),s=>{const event=s.val();if(initialEgg){initialEgg=false;lastEgg=event?.id;return;}if(event?.id&&event.id!==lastEgg){lastEgg=event.id;if(Math.abs(Date.now()-event.at)<15000)celebrate();}},e=>console.warn(e));
</script></body></html>
